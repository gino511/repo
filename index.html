<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行車記錄器轉 MP4</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "PingFang TC", sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; line-height: 1.5; }
  h1 { font-size: 1.3rem; }
  button, input[type=file]::file-selector-button { font-size: 1rem; padding: 10px 16px; border-radius: 10px; border: 0; background: #0a84ff; color: #fff; }
  button:disabled { opacity: .5; }
  label { display: block; margin: 12px 0; }
  progress { width: 100%; height: 14px; }
  .item { border: 1px solid #8884; border-radius: 12px; padding: 12px; margin: 14px 0; }
  video { width: 100%; border-radius: 8px; background: #000; }
  .name { font-weight: 600; word-break: break-all; margin-bottom: 6px; }
  #status { margin: 10px 0; min-height: 1.5em; }
</style>
</head>
<body>
<h1>行車記錄器轉 MP4</h1>
<p>選擇影片後在瀏覽器內直接轉檔，檔案不會上傳到任何伺服器。</p>

<input type="file" id="files" multiple>
<label><input type="checkbox" id="small" checked> 縮小到 720p（轉檔快很多）</label>
<button id="go">開始轉檔</button>

<div id="status"></div>
<progress id="bar" value="0" max="1" hidden></progress>
<div id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
const FF = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/';
const CORE = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/';
const { toBlobURL, fetchFile } = FFmpegUtil;
const $ = id => document.getElementById(id);
let ffmpeg = null;

function setStatus(t) { $('status').textContent = t; }

async function loadFFmpeg() {
  if (ffmpeg) return;
  setStatus('載入轉檔引擎（約 30 MB，第一次較久）…');
  ffmpeg = new FFmpegWASM.FFmpeg();
  ffmpeg.on('progress', ({ progress }) => {
    $('bar').value = Math.min(Math.max(progress, 0), 1);
  });
  await ffmpeg.load({
    classWorkerURL: await toBlobURL(FF + '814.ffmpeg.js', 'text/javascript'),
    coreURL: await toBlobURL(CORE + 'ffmpeg-core.js', 'text/javascript'),
    wasmURL: await toBlobURL(CORE + 'ffmpeg-core.wasm', 'application/wasm'),
  });
}

function addResult(name, blob) {
  const url = URL.createObjectURL(blob);
  const file = new File([blob], name, { type: 'video/mp4' });
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = '<div class="name"></div><video controls playsinline preload="metadata"></video><p><button>儲存 / 分享</button></p>';
  div.querySelector('.name').textContent = name;
  div.querySelector('video').src = url;
  div.querySelector('button').onclick = async () => {
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
  };
  $('list').prepend(div);
}

async function convertOne(file, i, total) {
  const ext = (file.name.match(/\.[^.]+$/) || ['.ts'])[0].toLowerCase();
  const inName = 'input' + ext;
  const outName = 'output.mp4';
  const label = `(${i}/${total}) ${file.name}`;
  $('bar').value = 0;
  setStatus('讀取中 ' + label);
  await ffmpeg.writeFile(inName, await fetchFile(file));
  setStatus('轉檔中 ' + label);
  const args = ['-i', inName];
  if ($('small').checked) args.push('-vf', "scale='min(1280,iw)':-2");
  args.push('-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '26', '-pix_fmt', 'yuv420p',
            '-c:a', 'aac', '-b:a', '128k', '-movflags', '+faststart', outName);
  const code = await ffmpeg.exec(args);
  if (code !== 0) throw new Error('ffmpeg 回傳錯誤碼 ' + code);
  const data = await ffmpeg.readFile(outName);
  await ffmpeg.deleteFile(inName);
  await ffmpeg.deleteFile(outName);
  addResult(file.name.replace(/\.[^.]+$/, '') + '.mp4', new Blob([data.buffer], { type: 'video/mp4' }));
}

$('go').onclick = async () => {
  const files = [...$('files').files];
  if (!files.length) { setStatus('請先選擇影片檔'); return; }
  $('go').disabled = true;
  $('bar').hidden = false;
  try {
    await loadFFmpeg();
    for (let i = 0; i < files.length; i++) {
      try { await convertOne(files[i], i + 1, files.length); }
      catch (e) { setStatus('失敗：' + files[i].name + '（' + e.message + '）'); await new Promise(r => setTimeout(r, 2500)); }
    }
    setStatus('完成');
  } catch (e) {
    ffmpeg = null;
    setStatus('載入失敗：' + (e && e.message ? e.message : String(e)));
  }
  $('bar').hidden = true;
  $('go').disabled = false;
};
</script>
</body>
</html>
